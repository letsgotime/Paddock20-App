<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1982FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0561c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08c519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#069613;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Carbon fiber background texture suggestion -->
  <rect x="0" y="0" width="600" height="140" fill="#111111" opacity="0.05" />
  
  <!-- Angled design element - similar to F1 livery -->
  <polygon points="0,0 600,0 550,140 0,140" fill="#080808" opacity="0.2" />
  
  <g filter="url(#dropShadow)">
    <!-- THE text with premium styling -->
    <text x="40" y="60" font-family="'Arial', sans-serif" font-weight="900" font-size="36" fill="url(#blueGradient)" letter-spacing="3">THE</text>
    
    <!-- GRID text with premium styling -->
    <text x="140" y="75" font-family="'Arial', sans-serif" font-weight="900" font-size="80" fill="url(#greenGradient)" letter-spacing="2">GRID</text>
    
    <!-- Racing checkered flag elements -->
    <rect x="40" y="95" width="15" height="15" fill="#1982FC" />
    <rect x="55" y="95" width="15" height="15" fill="#FFFFFF" opacity="0.8" />
    <rect x="70" y="95" width="15" height="15" fill="#1982FC" />
    <rect x="85" y="95" width="15" height="15" fill="#FFFFFF" opacity="0.8" />
    
    <rect x="40" y="110" width="15" height="15" fill="#FFFFFF" opacity="0.8" />
    <rect x="55" y="110" width="15" height="15" fill="#1982FC" />
    <rect x="70" y="110" width="15" height="15" fill="#FFFFFF" opacity="0.8" />
    <rect x="85" y="110" width="15" height="15" fill="#1982FC" />
    
    <!-- Racing stripe -->
    <rect x="110" y="100" width="350" height="8" rx="4" fill="url(#greenGradient)" />
    <rect x="110" y="115" width="350" height="3" rx="1.5" fill="url(#blueGradient)" />
  </g>
</svg>