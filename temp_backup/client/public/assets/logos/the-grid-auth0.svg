<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1982FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0561c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08c519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#069613;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle grid pattern -->
  <rect x="0" y="0" width="600" height="140" fill="#0f0f0f" opacity="0.9" />
  
  <!-- Grid pattern to emphasize "The Grid" theme -->
  <g opacity="0.1">
    <rect x="20" y="20" width="560" height="1" fill="#FFFFFF" />
    <rect x="20" y="40" width="560" height="1" fill="#FFFFFF" />
    <rect x="20" y="60" width="560" height="1" fill="#FFFFFF" />
    <rect x="20" y="80" width="560" height="1" fill="#FFFFFF" />
    <rect x="20" y="100" width="560" height="1" fill="#FFFFFF" />
    <rect x="20" y="120" width="560" height="1" fill="#FFFFFF" />
    
    <rect x="20" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="120" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="220" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="320" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="420" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="520" y="20" width="1" height="100" fill="#FFFFFF" />
    <rect x="580" y="20" width="1" height="100" fill="#FFFFFF" />
  </g>
  
  <g filter="url(#dropShadow)">
    <!-- THE GRID text -->
    <text x="40" y="65" font-family="'Arial', sans-serif" font-weight="900" font-size="40" fill="url(#blueGradient)" letter-spacing="2">THE</text>
    <text x="150" y="70" font-family="'Arial', sans-serif" font-weight="900" font-size="60" fill="url(#greenGradient)" letter-spacing="2">GRID</text>
    
    <!-- Auth0 indicator -->
    <text x="380" y="70" font-family="'Arial', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" opacity="0.8">SECURE LOGIN</text>
    
    <!-- Lock icon to represent authentication -->
    <circle cx="350" cy="60" r="18" fill="#1982FC" opacity="0.9" />
    <rect x="340" y="55" width="20" height="15" rx="2" fill="#0f0f0f" />
    <rect x="344" y="45" width="12" height="10" rx="6" fill="#0f0f0f" />
    
    <!-- Racing stripes -->
    <rect x="40" y="95" width="520" height="6" rx="3" fill="url(#blueGradient)" />
    <rect x="40" y="110" width="520" height="4" rx="2" fill="url(#greenGradient)" />
  </g>
</svg>