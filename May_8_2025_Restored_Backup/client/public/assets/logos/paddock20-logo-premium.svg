<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1982FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0561c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08c519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#069613;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Carbon fiber background texture suggestion -->
  <rect x="0" y="0" width="600" height="140" fill="#111111" opacity="0.1" />
  
  <g filter="url(#dropShadow)">
    <!-- PADDOCK text with premium styling -->
    <text x="20" y="70" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#blueGradient)" letter-spacing="1">PADDOCK</text>
    
    <!-- 20 text with premium styling -->
    <text x="380" y="70" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#greenGradient)" letter-spacing="1">20</text>
    
    <!-- Racing stripes with premium styling -->
    <rect x="20" y="90" width="290" height="8" rx="4" fill="url(#blueGradient)" />
    <rect x="320" y="90" width="130" height="8" rx="4" fill="url(#greenGradient)" />
    
    <!-- F1-inspired design elements -->
    <rect x="20" y="105" width="430" height="3" rx="1.5" fill="#1982FC" opacity="0.7" />
    <rect x="20" y="112" width="430" height="2" rx="1" fill="#08c519" opacity="0.7" />
  </g>
</svg>