<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
  <style>
    .blue-text { fill: #1982FC; font-family: 'Arial', sans-serif; font-weight: bold; }
    .green-text { fill: #08c519; font-family: 'Arial', sans-serif; font-weight: bold; }
    .blue-stripe { fill: #1982FC; }
    .green-stripe { fill: #08c519; }
  </style>
  
  <!-- PADDOCK in blue -->
  <text x="10" y="65" class="blue-text" font-size="62">PADDOCK</text>
  
  <!-- 20 in green -->
  <text x="295" y="65" class="green-text" font-size="62">20</text>
  
  <!-- Racing stripes -->
  <rect x="10" y="85" width="240" height="6" class="blue-stripe" />
  <rect x="250" y="85" width="110" height="6" class="green-stripe" />
</svg>