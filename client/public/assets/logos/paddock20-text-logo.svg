<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    .blue-text { fill: #1982FC; font-family: 'Orbitron', sans-serif; font-weight: 700; }
    .green-text { fill: #08c519; font-family: 'Orbitron', sans-serif; font-weight: 700; }
  </style>
  
  <!-- PADDOCK in blue -->
  <text x="10" y="40" class="blue-text" font-size="36">PADDOCK</text>
  
  <!-- 20 in green -->
  <text x="170" y="40" class="green-text" font-size="36">20</text>
</svg>