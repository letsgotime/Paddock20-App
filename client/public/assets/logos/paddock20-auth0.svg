<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1982FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08c519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06a614;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simple transparent background -->
  <rect x="0" y="0" width="240" height="80" fill="#FFFFFF" opacity="0" />
  
  <!-- PADDOCK in blue -->
  <text x="10" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="url(#blueGradient)">PADDOCK</text>
  
  <!-- 20 in green - positioned right next to PADDOCK -->
  <text x="170" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="url(#greenGradient)">20</text>
  
  <!-- Simple racing stripe -->
  <rect x="10" y="55" width="210" height="3" rx="1.5" fill="url(#blueGradient)" />
</svg>