<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Simple transparent background -->
  <rect x="0" y="0" width="240" height="80" fill="#FFFFFF" opacity="0" />
  
  <!-- PADDOCK in Carolina blue -->
  <text x="10" y="45" font-family="'Orbitron', sans-serif" font-weight="700" font-size="32" fill="#1982FC">PADDOCK</text>
  
  <!-- 20 in GoTime green - positioned right next to PADDOCK -->
  <text x="170" y="45" font-family="'Orbitron', sans-serif" font-weight="700" font-size="32" fill="#08c519">20</text>
  
  <!-- Simple racing stripe -->
  <rect x="10" y="55" width="210" height="3" rx="1.5" fill="#1982FC" />
</svg>