<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Paddock20</title>
    <script>
      // Dynamic title update based on active page
      document.addEventListener('DOMContentLoaded', function() {
        // Initial title set
        updatePageTitle();
        
        // Listen for route changes
        const originalPushState = history.pushState;
        history.pushState = function() {
          originalPushState.apply(this, arguments);
          updatePageTitle();
        };
        
        window.addEventListener('popstate', function() {
          updatePageTitle();
        });
        
        function updatePageTitle() {
          const currentPath = window.location.pathname;
          let pageTitle = 'Home';
          
          // Extract page name from path
          if (currentPath !== '/') {
            // Remove leading slash and convert to title case
            pageTitle = currentPath.substring(1).split('/')[0]
              .replace(/-/g, ' ')
              .split(' ')
              .map(word => word.charAt(0).toUpperCase() + word.slice(1))
              .join(' ');
          }
          
          // Update the document title
          document.title = `${pageTitle} | Paddock20`;
        }
      });
    </script>
    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon for iOS devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Microsoft Tile Icon for Windows -->
    <meta name="msapplication-TileImage" content="/favicon.png" />
    <meta name="msapplication-TileColor" content="#22c55e" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Paddock20 - The exclusive destination for car enthusiasts" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
